[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ppt-agent-studio"
version = "0.1.0"
description = "Python Agent runtime for PPT Agent Studio."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "python-pptx>=1.0.0",
  "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]
