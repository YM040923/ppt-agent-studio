name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e agent[dev]
      - name: Run tests
        run: python -m pytest agent\tests -q

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build WinUI app
        run: dotnet build PptAgentStudio.slnx
      - name: Run .NET tests
        run: dotnet test desktop\PptAgentStudio.App.Tests\PptAgentStudio.App.Tests.csproj
      - name: Package unsigned MSIX
        run: >
          dotnet build desktop\PptAgentStudio.App\PptAgentStudio.App.csproj
          -c Release
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxPackageSigningEnabled=false
          -p:UapAppxPackageBuildMode=SideloadOnly
          -p:AppxBundle=Never
          -p:PublishTrimmed=false
      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ppt-agent-studio-msix
          path: desktop/PptAgentStudio.App/AppPackages/**/*.msix
